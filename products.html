<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Products</title>

<style>
/* ---------- RESET ---------- */
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  font-family: Arial, sans-serif;
}

/* ---------- HEADER ---------- */
header {
  background: #ff1f1f;
  padding: 15px 30px;
  display: flex;
  align-items: center;
  justify-content: space-between;
}

.logo img {
  height: 40px;
}

.nav-buttons a {
  background: #ffe6cc;
  border-radius: 20px;
  padding: 8px 18px;
  margin-left: 10px;
  font-weight: bold;
  text-decoration: none;
  color: black;
}

.nav-buttons a.active {
  background: white;
  color: #ff1f1f;
}

/* ---------- PAGE ---------- */
.page {
  padding: 40px 30px;
}

.section-title {
  font-size: 28px;
  margin-bottom: 20px;
}

/* ---------- STATIC GRID ---------- */
.product-grid {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 20px;
  margin-bottom: 60px;
}

.product-grid img {
  width: 100%;
  height: 260px;
  object-fit: cover;
  border-radius: 6px;
}

/* ---------- SCROLLING ROW ---------- */
.scroll-wrapper {
  position: relative;
}

.scroll-row {
  display: flex;
  gap: 20px;
  overflow-x: auto;
  scroll-behavior: smooth;
  padding-bottom: 10px;
}

.scroll-row::-webkit-scrollbar {
  display: none;
}

.scroll-row img {
  min-width: 280px;
  height: 260px;
  object-fit: cover;
  border-radius: 6px;
}

/* ---------- ARROWS ---------- */
.scroll-btn {
  position: absolute;
  top: 50%;
  transform: translateY(-50%);
  background: #eee;
  border-radius: 50%;
  width: 42px;
  height: 42px;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  font-size: 20px;
  user-select: none;
}

.scroll-btn.left {
  left: -20px;
}

.scroll-btn.right {
  right: -20px;
}

/* ---------- FOOTER ---------- */
footer {
  margin-top: 60px;
}

.footer-content {
  max-width: 1100px;
  margin: 0 auto;
  padding: 30px;
}

.footer-divider {
  height: 1px;
  background: #ffaaaa;
  margin: 25px 0 45px 0;
}

.footer-grid {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 20px;
  text-align: center;
}

.footer-grid h3 {
  font-size: 14px;
  margin-bottom: 8px;
}

.footer-grid p {
  font-size: 12px;
}

.footer-bottom {
  background: #444;
  color: white;
}

.footer-bottom-inner {
  max-width: 1100px;
  margin: 0 auto;
  padding: 15px 30px;
  font-size: 12px;
}

/* ---------- RESPONSIVE ---------- */
@media (max-width: 900px) {
  .product-grid {
    grid-template-columns: repeat(2, 1fr);
  }
}

@media (max-width: 500px) {
  .product-grid {
    grid-template-columns: 1fr;
  }
}
</style>
</head>

<body>

<!-- ================= HEADER (SAME AS HOME) ================= -->
<header>
  <div class="logo">
    <a href="index.html">
      <img src="https://i.ibb.co/Jj5xw5Dh/Luke-Tenn-Logo-2025-White.png" alt="LukeTenn Logo">
    </a>
  </div>

  <nav class="nav-buttons">
    <a href="products.html" class="active">Products</a>
    <a href="gallery.html">LukeTenn Gallery</a>
    <a href="services.html">Services</a>
  </nav>
</header>
<!-- ======================================================== -->

<div class="page">

  <!-- ---------- SECTION 1 ---------- -->
  <h2 class="section-title">Featured Products</h2>

  <div class="product-grid">
    <img src="images/product1.jpg" alt="">
    <img src="images/product2.jpg" alt="">
    <img src="images/product3.jpg" alt="">
    <img src="images/product4.jpg" alt="">
  </div>

  <!-- ---------- SECTION 2 ---------- -->
  <h2 class="section-title">More Products</h2>

  <div class="scroll-wrapper">
    <div class="scroll-btn left" onclick="scrollProducts(-1)">&#8249;</div>

    <div class="scroll-row" id="productScroll">
      <img src="images/product5.jpg" alt="">
      <img src="images/product6.jpg" alt="">
      <img src="images/product7.jpg" alt="">
      <img src="images/product8.jpg" alt="">
      <img src="images/product9.jpg" alt="">
    </div>

    <div class="scroll-btn right" onclick="scrollProducts(1)">&#8250;</div>
  </div>

</div>

<!-- ================= FOOTER (RED LINE + EVERYTHING BELOW) ================= -->
<footer>
  <div class="footer-content">

    <div class="footer-divider"></div>

    <div class="footer-grid">
      <div>
        <h3>Contact Us</h3>
        <p>Contact<br>Feedback</p>
      </div>
      <div>
        <h3>Our Partners</h3>
        <p>Creamy's Wonderland</p>
      </div>
      <div>
        <h3>About Us</h3>
        <p>MRB</p>
      </div>
      <div>
        <h3>Follow Us</h3>
        <p>YouTube<br>X (Twitter)</p>
      </div>
    </div>

  </div>

  <div class="footer-bottom">
    <div class="footer-bottom-inner">
      ©2025 LukeTenn. ©2016 – 2025
    </div>
  </div>
</footer>
<!-- ====================================================================== -->

<script>
/* ---------- SCROLL BUTTON LOGIC ---------- */
function scrollProducts(direction) {
  const row = document.getElementById('productScroll');
  const scrollAmount = 320;
  row.scrollBy({
    left: direction * scrollAmount,
    behavior: 'smooth'
  });
}
</script>

</body>
</html>
