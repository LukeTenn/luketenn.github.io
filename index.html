<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Home</title>

<style>
/* ---------- RESET ---------- */
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  font-family: Arial, sans-serif;
}

/* ---------- HEADER ---------- */
header {
  background: #ff1f1f;
  padding: 15px 30px;
  display: flex;
  align-items: center;
  justify-content: space-between;
}

.logo img {
  height: 40px;
  object-fit: contain;
}

/* ---------- NAV ---------- */
.nav-buttons a {
  background: #ffe6cc;
  border-radius: 20px;
  padding: 8px 18px;
  margin-left: 10px;
  font-weight: bold;
  text-decoration: none;
  color: black;
  display: inline-block;
}

.nav-buttons a:hover {
  background: #ffd4a3;
}

.nav-buttons a.active {
  background: white;
  color: #ff1f1f;
}

/* ---------- HERO SLIDER ---------- */
.hero {
  position: relative;
  height: 503px;
  overflow: hidden;
}

.hero-track {
  display: flex;
  height: 100%;
  will-change: transform;
}

.hero-track img {
  height: 100%;
  object-fit: cover;
  flex-shrink: 0;
}

/* ---------- CAROUSEL ---------- */
.carousel-section {
  padding: 40px 30px;
}

.carousel-header {
  margin-bottom: 20px;
}

.carousel-header h2 {
  font-size: 42px;
}

.carousel {
  display: flex;
  align-items: center;
  gap: 15px;
}

.arrow {
  background: #ddd;
  border-radius: 50%;
  width: 40px;
  height: 40px;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  font-size: 20px;
  user-select: none;
}

.carousel-images {
  display: flex;
  gap: 15px;
  flex: 1;
}

.carousel-images img {
  width: 100%;
  height: 180px;
  object-fit: cover;
  flex: 1;
}

/* ---------- TEXT GRID ---------- */
.text-grid {
  border-top: 1px solid #ffaaaa;
  padding: 30px;
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 20px;
  text-align: center;
}

.text-grid h3 {
  font-size: 14px;
  margin-bottom: 8px;
}

.text-grid p {
  font-size: 12px;
}

/* ---------- FOOTER ---------- */
footer {
  background: white;
  color: black;
  font-size: 12px;
}

/* red divider line (short, centered, unmistakable) */
.footer-divider {
  height: 1px;
  background: #ffaaaa;
  width: 100%;
}

.footer-divider-wrap {
  max-width: 900px;
  margin: 0 auto;
  padding: 0 30px;
}

/* main footer content (white area) */
.footer-content {
  padding: 30px;
}

/* footer grid (same look as before) */
.footer-grid {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 20px;
  text-align: center;
}

.footer-grid h3 {
  font-size: 14px;
  margin-bottom: 8px;
}

.footer-grid p {
  font-size: 12px;
}

/* dark bottom bar ONLY */
.footer-bottom {
  background: #444;
  color: white;
  text-align: left;
  padding: 15px;
  font-size: 12px;
  margin-top: 30px;
}

/* ---------- RESPONSIVE ---------- */
@media (max-width: 900px) {
  .carousel-images {
    overflow-x: auto;
  }

  .carousel-images img {
    min-width: 150px;
  }

  .text-grid {
    grid-template-columns: repeat(2, 1fr);
  }
}

@media (max-width: 500px) {
  header {
    flex-direction: column;
    gap: 10px;
  }

  .nav-buttons {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
  }

  .hero {
    height: 220px;
  }

  .text-grid {
    grid-template-columns: 1fr;
  }
}
</style>
</head>

<body>

<!-- ================== SITE HEADER (COPY EXACTLY) ================== -->
<header>
  <div class="logo">
    <a href="index.html">
      <img src="https://i.ibb.co/Jj5xw5Dh/Luke-Tenn-Logo-2025-White.png" alt="LukeTenn Logo">
    </a>
  </div>

  <nav class="nav-buttons">
    <a href="products.html">Products</a>
    <a href="gallery.html">LukeTenn Gallery</a>
    <a href="services.html">Services</a>
  </nav>
</header>
<!-- =============================================================== -->

<section class="hero">
  <div class="hero-track" id="heroTrack">
    <img src="https://i.ibb.co/s9Z1r75v/Card-Creator-Banner-Luke-Tenn-Website.png" alt="">
    <img src="https://i.ibb.co/tT4zYsbP/Project-Chronogy-Banner-Luke-Tenn-Website.png" alt="">
    <img src="https://i.ytimg.com/vi/jxqFPqm0AZg/hqdefault.jpg" alt="">
  </div>
</section>

<section class="carousel-section">
  <div class="carousel-header">
    <h2>Discover the World of LukeTenn</h2>
  </div>

  <div class="carousel">
    <div class="arrow">&#8249;</div>
    <div class="carousel-images">
      <img src="images/item1.jpg" alt="">
      <img src="images/item2.jpg" alt="">
      <img src="images/item3.jpg" alt="">
      <img src="images/item4.jpg" alt="">
      <img src="images/item5.jpg" alt="">
    </div>
    <div class="arrow">&#8250;</div>
  </div>
</section>

<footer>
  <div class="footer-content">

    <div class="footer-divider"></div>

    <div class="footer-grid">
      <div>
        <h3>Contact Us</h3>
        <p>Contact<br>Feedback</p>
      </div>
      <div>
        <h3>Our Partners</h3>
        <p>Creamy's Wonderland</p>
      </div>
      <div>
        <h3>About Us</h3>
        <p>MRB</p>
      </div>
      <div>
        <h3>Follow Us</h3>
        <p>YouTube<br>X (Twitter)</p>
      </div>
    </div>

  </div>

  <div class="footer-bottom">
    <div class="footer-bottom-inner">
      ©2025 LukeTenn. ©2016 – 2025
    </div>
  </div>
</footer>

<script>
/* ---------- INFINITE HERO SLIDER (PAUSE + RESUME EXACTLY) ---------- */

const heroTrack = document.getElementById('heroTrack');
let slides = heroTrack.querySelectorAll('img');
const clone = slides[0].cloneNode(true);
heroTrack.appendChild(clone);
slides = heroTrack.querySelectorAll('img');

let index = 0;
const slideDuration = 5000;
const transitionTime = 1000;
let timer = null;
let startTime = null;
let remainingTime = slideDuration;

function setHeroSizes() {
  const heroWidth = document.querySelector('.hero').offsetWidth;
  heroTrack.style.width = `${slides.length * heroWidth}px`;
  slides.forEach(s => s.style.width = `${heroWidth}px`);
  heroTrack.style.transform = `translateX(-${index * heroWidth}px)`;
}

setHeroSizes();
window.addEventListener('resize', setHeroSizes);

function nextHero() {
  const heroWidth = document.querySelector('.hero').offsetWidth;
  index++;
  heroTrack.style.transition = `transform ${transitionTime}ms ease-in-out`;
  heroTrack.style.transform = `translateX(-${index * heroWidth}px)`;

  if (index === slides.length - 1) {
    setTimeout(() => {
      heroTrack.style.transition = 'none';
      index = 0;
      heroTrack.style.transform = 'translateX(0)';
    }, transitionTime);
  }

  startTime = Date.now();
  timer = setTimeout(nextHero, slideDuration);
}

function startSlider(time = remainingTime) {
  startTime = Date.now();
  timer = setTimeout(nextHero, time);
}

function stopSlider() {
  clearTimeout(timer);
  remainingTime = Math.max(slideDuration - (Date.now() - startTime), 0);
}

startSlider();

const heroSection = document.querySelector('.hero');
heroSection.addEventListener('mouseenter', stopSlider);
heroSection.addEventListener('mouseleave', () => startSlider(remainingTime));
</script>

</body>
</html>
