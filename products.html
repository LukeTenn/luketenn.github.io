<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Products</title>

<style>
/* ---------- RESET ---------- */
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  font-family: Arial, sans-serif;
}

/* ---------- HEADER ---------- */
header {
  background: #ff1f1f;
  padding: 15px 30px;
  display: flex;
  align-items: center;
  justify-content: space-between;
}

.logo img {
  height: 40px;
}

.nav-buttons a {
  background: #ffe6cc;
  border-radius: 20px;
  padding: 8px 18px;
  margin-left: 10px;
  font-weight: bold;
  text-decoration: none;
  color: black;
}

.nav-buttons a.active {
  background: white;
  color: #ff1f1f;
}

/* ---------- PAGE ---------- */
.page {
  padding: 40px 30px;
}

.section-title {
  font-size: 28px;
  margin-bottom: 20px;
}

/* ---------- STATIC GRID ---------- */
.product-grid {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 20px;
  margin-bottom: 60px;
}

.product-grid img {
  width: 100%;
  height: 260px;
  object-fit: cover;
  border-radius: 6px;
}

/* ---------- SCROLLING ROW ---------- */
.scroll-wrapper {
  position: relative;
}

.scroll-row {
  display: flex;
  gap: 20px;
  overflow-x: auto;
  scroll-behavior: smooth;
  padding-bottom: 10px;
}

.scroll-row::-webkit-scrollbar {
  display: none;
}

.scroll-row img {
  min-width: 280px;
  height: 260px;
  object-fit: cover;
  border-radius: 6px;
}

/* ---------- ARROWS ---------- */
.scroll-btn {
  position: absolute;
  top: 50%;
  transform: translateY(-50%);
  background: #eee;
  border-radius: 50%;
  width: 42px;
  height: 42px;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  font-size: 20px;
  user-select: none;
}

.scroll-btn.left {
  left: -20px;
}

.scroll-btn.right {
  right: -20px;
}

/* ---------- FOOTER (NEW LOGIC) ---------- */
footer {
  margin-top: 60px;
}

/* white / light footer area */
.footer-content {
  max-width: 1100px;
  margin: 0 auto;
  padding: 30px;
}

/* short red divider */
.footer-divider {
  height: 1px;
  background: #ffaaaa;
  margin: 25px 0 45px 0;
}
