<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mockup Layout</title>

<style>
/* ---------- RESET ---------- */
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  font-family: Arial, sans-serif;
}

/* ---------- HEADER ---------- */
header {
  background: #ff1f1f;
  padding: 15px 30px;
  display: flex;
  align-items: center;
  justify-content: space-between;
}

.logo img {
  height: 40px;
  object-fit: contain;
}

/* ---------- NAV BUTTONS ---------- */
.nav-buttons button {
  background: #ffe6cc;
  border: none;
  border-radius: 20px;
  padding: 8px 18px;
  margin-left: 10px;
  cursor: pointer;
  font-weight: bold;
}

/* ---------- HERO SLIDER ---------- */
.hero {
  position: relative;
  height: 350px;
  overflow: hidden;
}

.hero img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  position: absolute;
  top: 0;
  left: 100%;
  transition: left 1s ease-in-out;
}

/* ---------- CAROUSEL ---------- */
.carousel-section {
  padding: 40px 30px;
}

.carousel-header {
  text-align: left; /* move text to the left */
  margin-bottom: 20px;
}

.carousel-header h2 {
  font-weight: bold;
  font-size: 42px; /* larger text */
}

.carousel {
  display: flex;
  align-items: center;
  gap: 15px;
}

.arrow {
  background: #ddd;
  border-radius: 50%;
  width: 40px;
  height: 40px;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  font-size: 20px;
  user-select: none;
}

.carousel-images {
  display: flex;
  gap: 15px;
  flex: 1;
}

.carousel-images img {
  width: 100%;
  height: 180px;
  object-fit: cover;
  flex: 1;
}

/* ---------- TEXT GRID ---------- */
.text-grid {
  border-top: 1px solid #ffaaaa;
  padding: 30px;
  display: grid;
  grid-template-columns: repeat(4, 1fr); /* 4 columns */
  gap: 20px;
  text-align: center;
}

.text-grid h3 {
  font-size: 14px;
  margin-bottom: 8px;
}

.text-grid p {
  font-size: 12px;
}

/* ---------- FOOTER ---------- */
footer {
  background: #444;
  color: white;
  text-align: left; /* aligned left */
  padding: 15px;
  font-size: 12px;
}

/* ---------- RESPONSIVE ---------- */
@media (max-width: 900px) {
  .carousel-images {
    overflow-x: auto;
  }

  .carousel-images img {
    min-width: 150px;
  }

  .text-grid {
    grid-template-columns: repeat(2, 1fr);
  }
}

@media (max-width: 500px) {
  header {
    flex-direction: column;
    gap: 10px;
  }

  .nav-buttons {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
  }

  .hero {
    height: 220px;
  }

  .text-grid {
    grid-template-columns: 1fr;
  }
}
</style>
</head>
<body>

<header>
  <div class="logo">
    <img src="images/logo.png" alt="Logo">
  </div>
  <div class="nav-buttons">
    <button>Products</button>
    <button>LukeTenn Gallery</button>
    <button>Services</button>
  </div>
</header>

<section class="hero">
  <img src="https://i.ibb.co/s9Z1r75v/Card-Creator-Banner-Luke-Tenn-Website.png" alt="Hero 1">
  <img src="https://i.ibb.co/tT4zYsbP/Project-Chronogy-Banner-Luke-Tenn-Website.png" alt="Hero 2">
  <img src="https://i.ytimg.com/vi/jxqFPqm0AZg/hqdefault.jpg" alt="Hero 3">
</section>

<section class="carousel-section">
  <div class="carousel-header">
    <h2>Discover the World of LukeTenn</h2>
  </div>

  <div class="carousel">
    <div class="arrow">&#8249;</div>

    <div class="carousel-images">
      <img src="images/item1.jpg" alt="">
      <img src="images/item2.jpg" alt="">
      <img src="images/item3.jpg" alt="">
      <img src="images/item4.jpg" alt="">
      <img src="images/item5.jpg" alt="">
    </div>

    <div class="arrow">&#8250;</div>
  </div>
</section>

<section class="text-grid">
  <div>
    <h3>Contact Us</h3>
    <p>CONTACT<br>Feedback</p>
  </div>
  <div>
    <h3>Our Partners</h3>
    <p>Creamy's Wonderland<br></p>
  </div>
  <div>
    <h3>About Us</h3>
    <p>MRB<br></p>
  </div>
  <div>
    <h3>Follow Us</h3>
    <p>YouTube<br>X (Twitter)</p>
  </div>
</section>

<footer>
  ©2025 LukeTenn.  ©2016 - 2025
</footer>

<script>
// ---------- HERO SLIDER FUNCTION ----------
const heroImages = document.querySelectorAll('.hero img');
let currentHero = 0;

function showHero(index) {
  heroImages.forEach((img, i) => {
    img.style.left = (i === index ? 0 : 100) + '%';
  });
}

function nextHero() {
  currentHero = (currentHero + 1) % heroImages.length;
  showHero(currentHero);
}

// Initialize
showHero(currentHero);
setInterval(nextHero, 5000); // change every 5 seconds
</script>

</body>
</html>
